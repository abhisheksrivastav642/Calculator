<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
    }
    header {
      background: #007bff;
      color: white;
      padding: 20px 40px;
      text-align: center;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 20px;
    }
    .cta-button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }
    .cta-button:hover {
      background: #0056b3;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #e9ecef;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h2>My Landing Page</h2>
  </header>

  <section class="hero">
    <h1>Welcome to Our Website</h1>
    <p>We provide the best solutions to help your business grow. Join us and start your journey today.</p>
    <a href="#contact" class="cta-button">Get Started</a>
  </section>

  <footer>
    &copy; 2025 My Company. All rights reserved.
  </footer>

</body>
</html>
